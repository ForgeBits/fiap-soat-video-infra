apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fiapx
spec:
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-app
          image: vineco/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "400m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret