apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fiapx
spec:
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-app
          image: vineco/auth-service:v2.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret