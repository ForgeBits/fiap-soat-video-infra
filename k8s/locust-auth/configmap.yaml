apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-script
  namespace: fiapx
data:
  locustfile.py: |
    from locust import HttpUser, task, between, events
    import time
    import random
    import json
    import os
    import io

    AUTH_HOST   = os.getenv("AUTH_HOST",   "http://auth-service:80")
    API_HOST    = os.getenv("API_HOST",    "http://api-service:81")
    WORKER_HOST = os.getenv("WORKER_HOST", "http://worker-service:82")

    # Pool de usuários registrados para reuso entre tasks
    registered_users = []

    def generate_email():
        ts  = int(time.time() * 1_000_000)
        rnd = random.randint(1, 999_999)
        return f"loadtest_{ts}_{rnd}@fiapx.com"

    def make_dummy_video():
        """Gera um arquivo MP4 mínimo para upload (passa na validação de content-type)."""
        mp4_bytes = (
            b'\x00\x00\x00\x18ftypisom\x00\x00\x00\x00isom'
            b'\x00\x00\x00\x08mdat'
        )
        return io.BytesIO(mp4_bytes)

    class CommonAuth:
        """Mixin para lidar com autenticação de forma resiliente."""
        def authenticate(self, user):
            if not user.user_email:
                user.user_email = generate_email()
            
            password = "Senha123"
            # Tenta logar se já tiver e-mail
            login_success = self._login(user, user.user_email, password)
            if not login_success:
                # Se falhar o login, tenta registrar e logar novamente
                self._register(user, user.user_email, password)
                self._login(user, user.user_email, password)

        def _register(self, user, email, password):
            try:
                # Usa requests (self.client) se disponível, senão urllib
                if hasattr(user, 'client'):
                    with user.client.post("/auth/register", json={"email": email, "password": password}, 
                                         catch_response=True, name="AUTH: /auth/register") as r:
                        if r.status_code in (200, 201):
                            r.success()
                            return True
                        r.failure(f"Register failed: {r.status_code}")
                else:
                    import urllib.request
                    req = urllib.request.Request(f"{AUTH_HOST}/auth/register",
                        data=json.dumps({"email": email, "password": password}).encode(),
                        headers={"Content-Type": "application/json"}, method="POST")
                    with urllib.request.urlopen(req, timeout=5) as resp:
                        return resp.getcode() in (200, 201)
            except Exception:
                pass
            return False

        def _login(self, user, email, password):
            try:
                if hasattr(user, 'client'):
                    with user.client.post("/auth/login", json={"email": email, "password": password}, 
                                         catch_response=True, name="AUTH: /auth/login") as r:
                        if r.status_code == 200:
                            user.token = r.json().get("token")
                            r.success()
                            return True
                        r.failure(f"Login failed: {r.status_code}")
                else:
                    import urllib.request
                    req = urllib.request.Request(f"{AUTH_HOST}/auth/login",
                        data=json.dumps({"email": email, "password": password}).encode(),
                        headers={"Content-Type": "application/json"}, method="POST")
                    with urllib.request.urlopen(req, timeout=5) as resp:
                        if resp.getcode() == 200:
                            data = json.loads(resp.read())
                            user.token = data.get("token")
                            return True
            except Exception:
                pass
            return False

    # ─────────────────────────────────────────────────────────
    # AUTH SERVICE
    # ─────────────────────────────────────────────────────────
    class AuthServiceUser(HttpUser, CommonAuth):
        host      = AUTH_HOST
        wait_time = between(0.5, 2)
        weight    = 3

        token      = None
        user_email = None

        def on_start(self):
            self.client.headers.update({"Content-Type": "application/json"})
            self.authenticate(self)

        @task(1)
        def health(self):
            with self.client.get("/health", catch_response=True, name="AUTH: /health") as r:
                r.success() if r.status_code == 200 else r.failure(str(r.status_code))

        @task(10)
        def register(self):
            email = generate_email()
            with self.client.post("/auth/register", json={"email": email, "password": "Senha123"},
                                 catch_response=True, name="AUTH: /auth/register") as r:
                if r.status_code in (200, 201):
                    r.success()
                else:
                    r.failure(f"{r.status_code}: {r.text[:120]}")

        @task(8)
        def login(self):
            if not self.user_email:
                self.authenticate(self)
                if not self.user_email: return
            
            with self.client.post("/auth/login", json={"email": self.user_email, "password": "Senha123"},
                                 catch_response=True, name="AUTH: /auth/login") as r:
                if r.status_code == 200:
                    self.token = r.json().get("token")
                    r.success()
                else:
                    r.failure(f"{r.status_code}: {r.text[:120]}")

        @task(5)
        def validate_token(self):
            if not self.token:
                self.authenticate(self)
                if not self.token: return
                
            with self.client.post("/auth/validate", headers={"Authorization": f"Bearer {self.token}"},
                                 catch_response=True, name="AUTH: /auth/validate") as r:
                if r.status_code in (200, 201):
                    r.success()
                else:
                    if r.status_code == 401: self.authenticate(self)
                    r.failure(f"{r.status_code}: {r.text[:120]}")

    # ─────────────────────────────────────────────────────────
    # API SERVICE
    # ─────────────────────────────────────────────────────────
    class ApiServiceUser(HttpUser, CommonAuth):
        host      = API_HOST
        wait_time = between(1, 3)
        weight    = 4

        token      = None
        user_email = None

        def on_start(self):
            self.authenticate(self)

        def _auth_headers(self):
            return {"Authorization": f"Bearer {self.token}"} if self.token else {}

        @task(1)
        def health(self):
            with self.client.get("/health", catch_response=True, name="API: /health") as r:
                r.success() if r.status_code == 200 else r.failure(str(r.status_code))

        @task(6)
        def list_videos(self):
            if not self.token:
                self.authenticate(self)
                if not self.token: return

            with self.client.get("/videos?page=1&limit=10", headers=self._auth_headers(),
                                catch_response=True, name="API: /videos") as r:
                if r.status_code in (200, 204):
                    r.success()
                else:
                    if r.status_code == 401: self.authenticate(self)
                    r.failure(f"{r.status_code}: {r.text[:120]}")

        @task(3)
        def list_processamentos(self):
            if not self.token:
                self.authenticate(self)
                if not self.token: return

            with self.client.get("/videos/processamentos", headers=self._auth_headers(),
                                catch_response=True, name="API: /videos/processamentos") as r:
                if r.status_code in (200, 204):
                    r.success()
                else:
                    if r.status_code == 401: self.authenticate(self)
                    r.failure(f"{r.status_code}: {r.text[:120]}")

        @task(2)
        def upload_video(self):
            if not self.token:
                self.authenticate(self)
                if not self.token: return

            video_data = make_dummy_video()
            # Tenta /v1/videos/process e /videos/process como fallback
            paths = ["/v1/videos/process", "/videos/process"]
            for path in paths:
                with self.client.post(path, headers=self._auth_headers(),
                                     files={"file": ("video.mp4", video_data, "video/mp4")},
                                     data={"format": "png", "framesPerSecond": "15"},
                                     catch_response=True, name=f"API: {path}") as r:
                    if r.status_code in (200, 201, 202):
                        r.success()
                        return
                    elif r.status_code == 404:
                        r.success() # Tenta o próximo path no loop
                        continue
                    else:
                        if r.status_code == 401: self.authenticate(self)
                        r.failure(f"{r.status_code}: {r.text[:120]}")
                        return

    # ─────────────────────────────────────────────────────────
    # WORKER SERVICE
    # ─────────────────────────────────────────────────────────
    class WorkerServiceUser(HttpUser):
        host      = WORKER_HOST
        wait_time = between(2, 5)
        weight    = 1

        @task(3)
        def health(self):
            with self.client.get(
                "/health",
                catch_response=True,
                name="WORKER: /health",
            ) as r:
                r.success() if r.status_code == 200 else r.failure(str(r.status_code))

        @task(1)
        def health_detailed(self):
            with self.client.get(
                "/health/detailed",
                catch_response=True,
                name="WORKER: /health/detailed",
            ) as r:
                r.success() if r.status_code == 200 else r.failure(str(r.status_code))

    # ─────────────────────────────────────────────────────────
    # Events
    # ─────────────────────────────────────────────────────────
    @events.test_start.add_listener
    def on_test_start(environment, **kwargs):
        print("🚀 Iniciando teste de carga — fiapx (auth + api + worker)")

    @events.test_stop.add_listener
    def on_test_stop(environment, **kwargs):
        s = environment.stats.total
        print("\n📊 Resultado final:")
        print(f"  Requisições totais : {s.num_requests}")
        print(f"  Falhas             : {s.num_failures}")
        print(f"  Taxa de falha      : {s.fail_ratio * 100:.2f}%")
        print(f"  RPS médio          : {s.total_rps:.2f}")
        print(f"  Tempo médio        : {s.avg_response_time:.2f}ms")
        print(f"  P95                : {s.get_response_time_percentile(0.95):.2f}ms")
        print(f"  P99                : {s.get_response_time_percentile(0.99):.2f}ms")