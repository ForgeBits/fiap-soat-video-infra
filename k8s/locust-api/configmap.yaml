apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-api-script
  namespace: fiapx
data:
  locustfile.py: |
    
    from locust import HttpUser, task, between, events
    from locust.clients import HttpSession
    import time
    import random
    import os

    class ApiUser(HttpUser):
        """
        Usuário Locust para teste de carga da API Service
        """
        
        # Tempo de espera entre requisições (1-3 segundos - API é mais pesada)
        wait_time = between(1, 3)
        
        # Token será obtido do auth
        token = None
        # Email do usuário
        user_email = None
        
        # URL do Auth Service (fixo)
        auth_service_url = "http://auth-service:3000"
        
        def on_start(self):
            """
            Executado quando um usuário inicia
            Registra usuário e faz login no Auth para obter token
            """
            # Criar usuário no auth
            self.user_email = self.generate_email()
            
            # Criar um client HTTP separado para o Auth Service
            auth_client = HttpSession(base_url=self.auth_service_url)
            
            try:
                # Registrar no Auth Service
                auth_response = auth_client.post(
                    "/auth/register",
                    json={
                        "email": self.user_email,
                        "password": "Senha123"
                    }
                )
                
                if auth_response.status_code == 201:
                    # Login para obter token
                    login_response = auth_client.post(
                        "/auth/login",
                        json={
                            "email": self.user_email,
                            "password": "Senha123"
                        }
                    )
                    
                    if login_response.status_code == 200:
                        try:
                            data = login_response.json()
                            if 'token' in data:
                                self.token = data['token']
                        except:
                            pass
            except Exception as e:
                print(f"Erro no setup: {e}")
                pass
        
        def generate_email(self):
            """
            Gera email único para teste
            """
            timestamp = int(time.time() * 1000000)
            random_num = random.randint(1, 999999)
            return f"apiuser_{timestamp}_{random_num}@loadtest.com"
        
        def generate_fake_video(self):
            """
            Gera um vídeo fake pequeno (1KB) para teste
            Não é um vídeo real, apenas bytes para simular upload
            """
            return os.urandom(1024)
        
        @task(10)
        def list_videos(self):
            """
            Lista vídeos (peso 10 - operação mais leve)
            """
            if not self.token:
                return
            
            headers = {
                'Authorization': f'Bearer {self.token}'
            }
            
            with self.client.get(
                "/videos?page=1&limit=10",
                headers=headers,
                catch_response=True,
                name="GET /videos"
            ) as response:
                if response.status_code >= 200 and response.status_code < 300:
                    response.success()
                else:
                    response.failure(f"Status {response.status_code}: {response.text[:100]}")
        
        @task(2)
        def process_video(self):
            """
            Processa vídeo (peso 2 - operação pesada)
            """
            if not self.token:
                return
            
            headers = {
                'Authorization': f'Bearer {self.token}'
            }
            
            # Gerar vídeo fake pequeno
            fake_video = self.generate_fake_video()
            
            # Preparar multipart/form-data
            files = {
                'files': ('test-video.mp4', fake_video, 'video/mp4')
            }
            
            data = {
                'format': 'png',
                'framesPerSecond': '15'
            }
            
            with self.client.post(
                "/videos/process",
                headers=headers,
                files=files,
                data=data,
                catch_response=True,
                name="POST /videos/process",
                timeout=60
            ) as response:
                if response.status_code == 201:
                    response.success()
                elif response.status_code >= 200 and response.status_code < 300:
                    response.success()
                else:
                    response.failure(f"Status {response.status_code}: {response.text[:100]}")
        
        @task(5)
        def get_video_detail(self):
            """
            Busca detalhes de um vídeo específico (peso 5)
            """
            if not self.token:
                return
            
            headers = {
                'Authorization': f'Bearer {self.token}'
            }
            
            # Simular busca por ID aleatório
            video_id = f"video-{random.randint(1, 1000)}"
            
            with self.client.get(
                f"/videos/{video_id}",
                headers=headers,
                catch_response=True,
                name="GET /videos/:id"
            ) as response:
                if response.status_code >= 200 and response.status_code < 300:
                    response.success()
                elif response.status_code == 404:
                    # 404 é esperado (vídeo não existe)
                    response.success()
                else:
                    response.failure(f"Status {response.status_code}: {response.text[:100]}")

    @events.test_start.add_listener
    def on_test_start(environment, **kwargs):
        print("🚀 Iniciando teste de carga da API...")
        print(f"📍 Target: {environment.host}")

    @events.test_stop.add_listener
    def on_test_stop(environment, **kwargs):
        print("✅ Teste de carga da API finalizado!")
        stats = environment.stats
        print(f"\n📊 Estatísticas:")
        print(f"  Total de requisições: {stats.total.num_requests}")
        print(f"  Requisições com falha: {stats.total.num_failures}")
        print(f"  Taxa de falha: {stats.total.fail_ratio * 100:.2f}%")
        print(f"  RPS médio: {stats.total.total_rps:.2f}")
        print(f"  Tempo médio: {stats.total.avg_response_time:.2f}ms")
        print(f"  P95: {stats.total.get_response_time_percentile(0.95):.2f}ms")

