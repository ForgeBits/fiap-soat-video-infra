apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-app
          image: vineco/api-fiapx-11soat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret